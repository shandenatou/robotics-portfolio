<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img"><title>历史 Value 与 ASAR</title><desc>方法示意；灰色为输入或冻结模块，蓝色为本实验学习的模块。各阶段的更新范围见标题。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#57606a"/></marker></defs><rect width="960" height="460" fill="#fff"/><g fill="#1f2328" font-family="Arial, PingFang SC, sans-serif"><text x="24" y="32" font-size="19" font-weight="600">离线训练：更新历史聚合与 Value head</text><rect x="24.0" y="50" width="284.0" height="138" rx="4" fill="#eef6ff" stroke="#d0d7de"/><text x="40.0" y="79" font-size="18" font-weight="600">最近 5 步：视觉 latent ＋</text><text x="40.0" y="103" font-size="18" font-weight="600">16 维状态</text><text x="40.0" y="132" font-size="16" fill="#57606a">冻结视觉编码器 → 两层时序</text><text x="40.0" y="155" font-size="16" fill="#57606a">Transformer</text><path d="M312.0 119.0 H334.0" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="338.0" y="50" width="284.0" height="138" rx="4" fill="#eef6ff" stroke="#d0d7de"/><text x="354.0" y="79" font-size="18" font-weight="600">预测 256-bin 剩余时间进度分</text><text x="354.0" y="103" font-size="18" font-weight="600">布</text><text x="354.0" y="132" font-size="16" fill="#57606a">失败轨迹增加 35-chunk 惩罚，标</text><text x="354.0" y="155" font-size="16" fill="#57606a">签裁剪到 [0,1]</text><path d="M626.0 119.0 H648.0" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="652.0" y="50" width="284.0" height="138" rx="4" fill="#eef6ff" stroke="#d0d7de"/><text x="668.0" y="79" font-size="18" font-weight="600">同时监督真实后继与 World 预</text><text x="668.0" y="103" font-size="18" font-weight="600">测后继</text><text x="668.0" y="132" font-size="16" fill="#57606a">分布交叉熵 ＋ Value 一致性 ＋</text><text x="668.0" y="155" font-size="16" fill="#57606a">进度差约束</text><text x="24" y="230" font-size="19" font-weight="600">在线执行：冻结 Value 与 GWP</text><rect x="24.0" y="248" width="284.0" height="138" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><text x="40.0" y="277" font-size="18" font-weight="600">16 个动作 → 16 个预测未来</text><text x="40.0" y="306" font-size="16" fill="#57606a">按 ΔV = V(预测未来) − V(当前)</text><text x="40.0" y="329" font-size="16" fill="#57606a">排序</text><path d="M312.0 317.0 H334.0" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="338.0" y="248" width="284.0" height="138" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><text x="354.0" y="277" font-size="18" font-weight="600">ASAR：High 8 中找局部高密度</text><text x="354.0" y="301" font-size="18" font-weight="600">邻域</text><text x="354.0" y="330" font-size="16" fill="#57606a">稳健标准化 → 中心 / 邻居 → 加</text><text x="354.0" y="353" font-size="16" fill="#57606a">权重构动作</text><path d="M626.0 317.0 H648.0" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="652.0" y="248" width="284.0" height="138" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><text x="668.0" y="277" font-size="18" font-weight="600">执行前 12 步，获取新观测后</text><text x="668.0" y="301" font-size="18" font-weight="600">重规划</text><text x="668.0" y="330" font-size="16" fill="#57606a">旋转做四元数对齐，夹爪状态跟随</text><text x="668.0" y="353" font-size="16" fill="#57606a">中心候选</text><text x="24" y="428" font-size="16" fill="#57606a">图中 Value 不直接读取候选动作；动作通过预测未来影响评分。</text></g></svg>
