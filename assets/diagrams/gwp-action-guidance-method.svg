<svg xmlns="http://www.w3.org/2000/svg" width="960" height="368" viewBox="0 0 960 368" role="img"><title>GWP 两个实验各自的基线、改动与控制变量</title><desc>方法示意；灰色为输入或冻结模块，蓝色为本实验学习的模块。各阶段的更新范围见标题。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#57606a"/></marker></defs><rect width="960" height="368" fill="#fff"/><g fill="#1f2328" font-family="Arial, PingFang SC, sans-serif"><text x="24" y="32" font-size="20" font-weight="600" fill="#1f2328">共同基础：GWP-0.5 · 50-task SFT · 90K EMA（冻结）</text><text x="24" y="74" font-size="18" font-weight="600" fill="#1f2328">实验一：增加选择器 · 4 个候选</text><rect x="24" y="90" width="360" height="78" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><text x="40" y="120" font-size="17" font-weight="600" fill="#1f2328">基线：直接执行 candidate 0</text><text x="40" y="146" font-size="16" font-weight="400" fill="#1f2328">不按 Q 分数换动作</text><rect x="568" y="90" width="360" height="78" rx="4" fill="#eef6ff" stroke="#d0d7de"/><text x="584" y="120" font-size="17" font-weight="600" fill="#1f2328">改进：MC-return Twin-Q 门控</text><text x="584" y="146" font-size="16" font-weight="400" fill="#1f2328">两 Q 认可增益且分歧小，才替换</text><path d="M400 132 H550" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="411" y="119" font-size="15" font-weight="400" fill="#57606a">增加双 Q 与门控</text><text x="24" y="212" font-size="18" font-weight="600" fill="#1f2328">实验二：替换评分器 · 16 个候选 · 双方均使用 ASAR</text><rect x="24" y="228" width="360" height="78" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><text x="40" y="258" font-size="17" font-weight="600" fill="#1f2328">基线：MC-return Twin-Q</text><text x="40" y="284" font-size="16" font-weight="400" fill="#1f2328">Q 排序 → ASAR 邻域重构</text><rect x="568" y="228" width="360" height="78" rx="4" fill="#eef6ff" stroke="#d0d7de"/><text x="584" y="258" font-size="17" font-weight="600" fill="#1f2328">改进：历史条件 Value</text><text x="584" y="284" font-size="16" font-weight="400" fill="#1f2328">预测进度排序 → 相同 ASAR 重构</text><path d="M400 270 H550" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="411" y="257" font-size="15" font-weight="400" fill="#57606a">只替换评分器</text><text x="24" y="347" font-size="16" font-weight="400" fill="#57606a">两组各自配对评测；实验二不继承实验一的门控，也不共用其对照成功率。</text></g></svg>
