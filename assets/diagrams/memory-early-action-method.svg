<svg xmlns="http://www.w3.org/2000/svg" width="960" height="415" viewBox="0 0 960 415" role="img"><title>GWP 分层历史记忆与动作注入</title><desc>方法示意；灰色为输入或冻结模块，蓝色为本实验学习的模块。各阶段的更新范围见标题。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#57606a"/></marker></defs><rect width="960" height="415" fill="#fff"/><g fill="#1f2328" font-family="Arial, PingFang SC, sans-serif"><text x="24" y="32" font-size="19" font-weight="600">在线历史读取</text><rect x="24.0" y="50" width="284.0" height="138" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><text x="40.0" y="79" font-size="18" font-weight="600">保存过去重规划时的视觉</text><text x="40.0" y="103" font-size="18" font-weight="600">token</text><text x="40.0" y="132" font-size="16" fill="#57606a">近期 3 次保留完整 token；更早</text><text x="40.0" y="155" font-size="16" fill="#57606a">历史分层压缩</text><path d="M312.0 119.0 H334.0" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="338.0" y="50" width="284.0" height="138" rx="4" fill="#eef6ff" stroke="#d0d7de"/><text x="354.0" y="79" font-size="18" font-weight="600">当前观察查询历史 bank</text><text x="354.0" y="108" font-size="16" fill="#57606a">读出 8 个、每个 512 维的</text><text x="354.0" y="131" font-size="16" fill="#57606a">memory token</text><path d="M626.0 119.0 H648.0" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="652.0" y="50" width="284.0" height="138" rx="4" fill="#eef6ff" stroke="#d0d7de"/><text x="668.0" y="79" font-size="18" font-weight="600">注入 ActionExpert 第 4、8</text><text x="668.0" y="103" font-size="18" font-weight="600">层</text><text x="668.0" y="132" font-size="16" fill="#57606a">门控残差读取历史；视觉分支不注</text><text x="668.0" y="155" font-size="16" fill="#57606a">入</text><path d="M794.0 190 V206 H480.0 V221" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="24.0" y="226" width="912.0" height="91" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><text x="40.0" y="255" font-size="18" font-weight="600">冻结 GWP 主干完成动作预测</text><text x="40.0" y="284" font-size="16" fill="#57606a">预测 48 步，执行前 12 步，再读取新观测</text><text x="24" y="359" font-size="16" fill="#57606a">训练历史模块时主干冻结；推理时整个模型冻结。</text><text x="24" y="383" font-size="16" fill="#57606a">搭塔展示结果关闭右臂输出桥，只使用 Early-A 路径。</text></g></svg>
