<svg xmlns="http://www.w3.org/2000/svg" width="960" height="415" viewBox="0 0 960 415" role="img"><title>World-Q 奖励下的 ActionExpert LoRA</title><desc>方法示意；灰色为输入或冻结模块，蓝色为本实验学习的模块。各阶段的更新范围见标题。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#57606a"/></marker></defs><rect width="960" height="415" fill="#fff"/><g fill="#1f2328" font-family="Arial, PingFang SC, sans-serif"><text x="24" y="32" font-size="19" font-weight="600">训练：只更新 ActionExpert 的 LoRA 参数</text><rect x="24.0" y="50" width="284.0" height="138" rx="4" fill="#eef6ff" stroke="#d0d7de"/><text x="40.0" y="79" font-size="18" font-weight="600">冻结 SFT 主干 + rank-8</text><text x="40.0" y="103" font-size="18" font-weight="600">Action LoRA</text><text x="40.0" y="132" font-size="16" fill="#57606a">30 个动作 block；注意力 Q/K/V</text><text x="40.0" y="155" font-size="16" fill="#57606a">与输出映射</text><path d="M312.0 119.0 H334.0" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="338.0" y="50" width="284.0" height="138" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><text x="354.0" y="79" font-size="18" font-weight="600">生成动作 → 冻结 World 预测</text><text x="354.0" y="103" font-size="18" font-weight="600">未来</text><text x="354.0" y="132" font-size="16" fill="#57606a">action / world 各 10 步采样</text><path d="M626.0 119.0 H648.0" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="652.0" y="50" width="284.0" height="138" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><text x="668.0" y="79" font-size="18" font-weight="600">冻结 Twin-Q 评分动作与预测</text><text x="668.0" y="103" font-size="18" font-weight="600">未来</text><text x="668.0" y="132" font-size="16" fill="#57606a">reward = min(Q1, Q2)</text><path d="M794.0 190 V206 H244.5 V221" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="24.0" y="226" width="441.0" height="91" rx="4" fill="#eef6ff" stroke="#d0d7de"/><text x="40.0" y="255" font-size="18" font-weight="600">奖励反传到 LoRA，保持行为锚点</text><text x="40.0" y="284" font-size="16" fill="#57606a">loss = −mean(reward) + 0.1 action flow loss</text><path d="M469.0 271.5 H491.0" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="495.0" y="226" width="441.0" height="91" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><text x="511.0" y="255" font-size="18" font-weight="600">选定 checkpoint 后冻结全部参数评测</text><text x="511.0" y="284" font-size="16" fill="#57606a">固定 64 个 seed，统计修复与退化的任务数</text><text x="24" y="359" font-size="16" fill="#57606a">Self-attention 使用 Q/K/V/output；</text><text x="24" y="383" font-size="16" fill="#57606a">Cross-attention 仅用 Q/output，K/V 来自冻结视觉分支。</text></g></svg>
