<svg xmlns="http://www.w3.org/2000/svg" width="960" height="437" viewBox="0 0 960 437" role="img"><title>Monte-Carlo return Twin-Q 与门控</title><desc>方法示意；灰色为输入或冻结模块，蓝色为本实验学习的模块。各阶段的更新范围见标题。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#57606a"/></marker></defs><rect width="960" height="437" fill="#fff"/><g fill="#1f2328" font-family="Arial, PingFang SC, sans-serif"><text x="24" y="32" font-size="19" font-weight="600">离线训练：更新 Q1 / Q2，冻结 GWP</text><rect x="24.0" y="50" width="284.0" height="138" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><text x="40.0" y="79" font-size="18" font-weight="600">完整成功 / 失败 rollout</text><text x="40.0" y="108" font-size="16" fill="#57606a">终局成功奖励；反向累计 γ=0.99</text><text x="40.0" y="131" font-size="16" fill="#57606a">的 MC return</text><path d="M312.0 119.0 H334.0" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="338.0" y="50" width="284.0" height="138" rx="4" fill="#eef6ff" stroke="#d0d7de"/><text x="354.0" y="79" font-size="18" font-weight="600">编码当前视觉、预测未来、动</text><text x="354.0" y="103" font-size="18" font-weight="600">作和状态</text><text x="354.0" y="132" font-size="16" fill="#57606a">512 + 512 + 256 + 128 → 1408</text><text x="354.0" y="155" font-size="16" fill="#57606a">维特征</text><path d="M626.0 119.0 H648.0" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="652.0" y="50" width="284.0" height="138" rx="4" fill="#eef6ff" stroke="#d0d7de"/><text x="668.0" y="79" font-size="18" font-weight="600">两个 Q 网络分别拟合相同回报</text><text x="668.0" y="103" font-size="18" font-weight="600">目标</text><text x="668.0" y="132" font-size="16" fill="#57606a">Huber(Q1, G) + Huber(Q2, G)；</text><text x="668.0" y="155" font-size="16" fill="#57606a">1000 步</text><text x="24" y="230" font-size="19" font-weight="600">在线执行：不更新参数</text><rect x="24.0" y="248" width="441.0" height="91" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><text x="40.0" y="277" font-size="18" font-weight="600">GWP 生成 4 个候选及对应预测未来</text><text x="40.0" y="306" font-size="16" fill="#57606a">Q1 / Q2 对每个动作的前 12 步评分</text><path d="M469.0 293.5 H491.0" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="495.0" y="248" width="441.0" height="91" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><text x="511.0" y="277" font-size="18" font-weight="600">双 Q 增益均 ≥ 0.001，分歧 ≤ 0.08</text><text x="511.0" y="306" font-size="16" fill="#57606a">满足门限：替换；否则执行原 candidate 0</text><text x="24" y="381" font-size="16" fill="#57606a">Q 的此版本不输入语言；指令仍用于 GWP 生成。</text><text x="24" y="405" font-size="16" fill="#57606a">视觉编码器从进度评价器初始化，随 Q 一起训练。</text></g></svg>
