<svg xmlns="http://www.w3.org/2000/svg" width="960" height="391" viewBox="0 0 960 391" role="img"><title>LingBot 完整去噪进度 RL</title><desc>方法示意；灰色为输入或冻结模块，蓝色为本实验学习的模块。各阶段的更新范围见标题。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#57606a"/></marker></defs><rect width="960" height="391" fill="#fff"/><g fill="#1f2328" font-family="Arial, PingFang SC, sans-serif"><text x="24" y="32" font-size="19" font-weight="600">训练输入：50 条成功示范中的当前状态</text><rect x="24.0" y="50" width="284.0" height="138" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><text x="40.0" y="79" font-size="18" font-weight="600">同一输入、同一初始噪声</text><text x="40.0" y="108" font-size="16" fill="#57606a">可训练策略与冻结 Base 各执行完</text><text x="40.0" y="131" font-size="16" fill="#57606a">整 4 步去噪</text><path d="M312.0 119.0 H334.0" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="338.0" y="50" width="284.0" height="138" rx="4" fill="#eef6ff" stroke="#d0d7de"/><text x="354.0" y="79" font-size="18" font-weight="600">策略生成 z_pred；Base 生成</text><text x="354.0" y="103" font-size="18" font-weight="600">z_anchor</text><text x="354.0" y="132" font-size="16" fill="#57606a">评分对象为 decoder 前的 clean</text><text x="354.0" y="155" font-size="16" fill="#57606a">future latent</text><path d="M626.0 119.0 H648.0" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="652.0" y="50" width="284.0" height="138" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><text x="668.0" y="79" font-size="18" font-weight="600">三个冻结进度评价器取最小值</text><text x="668.0" y="108" font-size="16" fill="#57606a">reward = min(E1, E2, E3)(z_now</text><text x="668.0" y="131" font-size="16" fill="#57606a">, z_pred)</text><path d="M794.0 190 V206 H244.5 V221" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="24.0" y="226" width="441.0" height="91" rx="4" fill="#eef6ff" stroke="#d0d7de"/><text x="40.0" y="255" font-size="18" font-weight="600">反传进度奖励，约束预测偏离</text><text x="40.0" y="284" font-size="16" fill="#57606a">loss = −reward + 0.10 latent MSE + 0.05 方差</text><path d="M469.0 271.5 H491.0" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="495.0" y="226" width="441.0" height="91" rx="4" fill="#eef6ff" stroke="#d0d7de"/><text x="511.0" y="255" font-size="18" font-weight="600">更新共享 Transformer</text><text x="511.0" y="284" font-size="16" fill="#57606a">训练 1500 步，再做机器人闭环任务评测</text><text x="24" y="359" font-size="16" fill="#57606a">此路线没有显式动作奖励；动作通过共享参数间接改变。</text></g></svg>
