<g font-size="16"><text x="40" y="95">历史视觉 token</text><text x="40" y="124" font-size="13">最近 3 次完整，远期分层摘要</text><text x="265" y="95">当前观察查询历史</text><text x="265" y="124" font-size="13">读出 8 个 memory tokens</text><text x="490" y="95">动作层 4 / 8</text><text x="490" y="124" font-size="13">门控残差；GWP 主干冻结</text><text x="715" y="95">动作预测与执行</text><text x="715" y="124" font-size="13">预测 48 步，执行前 12 步</text></g>
