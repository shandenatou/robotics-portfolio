<svg xmlns="http://www.w3.org/2000/svg" width="960" height="368" viewBox="0 0 960 368" role="img"><title>FastWAM Flow-GRPO 后训练</title><desc>方法示意；灰色为输入或冻结模块，蓝色为本实验学习的模块。各阶段的更新范围见标题。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#57606a"/></marker></defs><rect width="960" height="368" fill="#fff"/><g fill="#1f2328" font-family="Arial, PingFang SC, sans-serif"><text x="24" y="32" font-size="19" font-weight="600">策略更新与环境采样</text><rect x="24.0" y="50" width="284.0" height="115" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><text x="40.0" y="79" font-size="18" font-weight="600">FastWAM 动作生成与环境</text><text x="40.0" y="103" font-size="18" font-weight="600">rollout</text><text x="40.0" y="132" font-size="16" fill="#57606a">同一采样组保留候选动作及回报</text><path d="M312.0 107.5 H334.0" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="338.0" y="50" width="284.0" height="115" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><text x="354.0" y="79" font-size="18" font-weight="600">保存动作去噪轨迹 sidecar</text><text x="354.0" y="108" font-size="16" fill="#57606a">按 trace ID 关联 rollout 与训</text><text x="354.0" y="131" font-size="16" fill="#57606a">练 bundle</text><path d="M626.0 107.5 H648.0" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="652.0" y="50" width="284.0" height="115" rx="4" fill="#eef6ff" stroke="#d0d7de"/><text x="668.0" y="79" font-size="18" font-weight="600">由组内回报计算 advantage</text><text x="668.0" y="108" font-size="16" fill="#57606a">把连续动作去噪轨迹交给 actor</text><text x="668.0" y="131" font-size="16" fill="#57606a">worker</text><path d="M794.0 167 V183 H244.5 V198" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="24.0" y="203" width="441.0" height="91" rx="4" fill="#eef6ff" stroke="#d0d7de"/><text x="40.0" y="232" font-size="18" font-weight="600">Flow-GRPO 更新策略参数</text><text x="40.0" y="261" font-size="16" fill="#57606a">记录 policy loss、梯度与更新前后 KL</text><path d="M469.0 248.5 H491.0" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="495.0" y="203" width="441.0" height="91" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><text x="511.0" y="232" font-size="18" font-weight="600">更新后的策略进入下一轮 rollout</text><text x="511.0" y="261" font-size="16" fill="#57606a">独立评测 Clean / Randomized 叠碗成功率</text><text x="24" y="336" font-size="16" fill="#57606a">图示为实际桥接流程；训练曲线和评测在实验记录中分列。</text></g></svg>
